<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alo.ai</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .night { fill:var(--night); }
  .moon { fill:var(--moon); }
  .coral { fill:var(--coral); }
  .leaf { fill:var(--leaf); }
  .soft { fill:var(--night-soft); }
  .ring { fill:none; stroke:var(--moon); stroke-width:8px; }
  .ring-soft { fill:none; stroke:var(--night-soft); stroke-width:6px; }
  .dot { fill:var(--moon); }
  .dot-soft { fill:var(--night-soft); }
  .blk { rx:var(--radius-xl); }
  .pill { rx:var(--radius-l); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.92; font-weight:700; letter-spacing:-1px; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-family:var(--font-ui); font-size:14px; line-height:20px; font-weight:700; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      night 224x320 slab bled off the top and bottom (the brand, largest) · moon disc r=64 (reward) · coral pill 128x48 (the call) · leaf pill 64x48 once (done) · night-soft 160x96 tint for relief; about 35% of 960x288
  arrangement one tall night slab with satellites: the moon rises over its left edge, coral and leaf pills sit on one line at space-6 from the bottom
  pattern     adire resist circles, from the README's "Adire resist-dye circles give the pattern": moon rings with gold centres cut into the night slab, small night-soft rings and dots over the tint, as on Jàpá's shell
  scales      gutters space-4; pitch space-8 (64); slab and tint corners radius-xl; pills radius-l (half of 48); rings at space-2 stroke
-->
<rect class="soft blk" x="16" y="32" width="160" height="96"/>
<circle class="ring-soft" cx="56" cy="80" r="20"/><circle class="dot-soft" cx="56" cy="80" r="5"/>
<circle class="ring-soft" cx="120" cy="80" r="20"/><circle class="dot-soft" cx="120" cy="80" r="5"/>
<rect class="night blk" x="208" y="-32" width="224" height="352"/>
<circle class="ring" cx="272" cy="160" r="28"/><circle class="dot" cx="272" cy="160" r="8"/>
<circle class="ring" cx="368" cy="96" r="28"/><circle class="dot" cx="368" cy="96" r="8"/>
<circle class="ring" cx="368" cy="224" r="28"/><circle class="dot" cx="368" cy="224" r="8"/>
<circle class="dot" cx="272" cy="64" r="6"/><circle class="dot" cx="272" cy="256" r="6"/>
<circle class="moon" cx="208" cy="64" r="64"/>
<rect class="coral pill" x="16" y="208" width="128" height="48"/>
<rect class="leaf pill" x="160" y="208" width="64" height="48"/>
</svg>
</div>
<div class="words">
<h1 class="name">Alo.ai</h1>
<p class="tag">Stories that listen back.</p>
</div>
</div>
</body>
</html>
