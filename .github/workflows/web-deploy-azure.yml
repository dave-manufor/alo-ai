# Builds the web app and deploys it to Azure Static Web Apps (infra/azure/apps.tf).
#
# Manual only (workflow_dispatch): it needs the Azure side to exist first (infra/azure/README.md),
# so it does not run on every push. It signs in to Azure with GitHub's OIDC token (no key files)
# and reads the Static Web Apps deployment token at run time, so no token is stored anywhere.
#
# Repository variables it reads (Settings > Secrets and variables > Actions > Variables), all
# public values: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (the CI identity),
# AZURE_RESOURCE_GROUP (aloai-rg), AZURE_WEB_APP_NAME (output web_app_name), and for the build
# VITE_ENTRA_CLIENT_ID, VITE_ENTRA_AUTHORITY, VITE_ENTRA_API_SCOPE and VITE_ALO_API_URL (output
# account_url). All four VITE_* are required: the build is a live build only when they are set
# (apps/web/src/api/mode.ts), and without them the deployed site would quietly be the sample build,
# so the first step fails the run if one is missing.
name: Deploy web app to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write # the OIDC token for azure/login
  contents: read

concurrency:
  group: web-deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Check the live-build settings are present
        working-directory: .
        run: |
          missing=0
          for name in VITE_ENTRA_CLIENT_ID VITE_ENTRA_AUTHORITY VITE_ENTRA_API_SCOPE VITE_ALO_API_URL; do
            if [ -z "${!name}" ]; then echo "::error::repository variable $name is not set"; missing=1; fi
          done
          exit $missing
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_ALO_API_URL: ${{ vars.VITE_ALO_API_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The build reads only public settings: the app is a public client with no secret.
      - run: npm run build
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_ALO_API_URL: ${{ vars.VITE_ALO_API_URL }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Static Web Apps
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          npx --yes @azure/static-web-apps-cli@2.0.8 deploy dist \
            --deployment-token "$token" --env production
