[project]
name = "aloai-passage-generator"
version = "0.1.0"
requires-python = ">=3.11"
description = "Alo.ai Passage Generator (W2): the Story Writer + Critic loop, the code gate and the artifact builder"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6"]

[tool.pytest.ini_options]
# Run from the repo root with: pytest -c services/core/generator/pyproject.toml services/core/generator
pythonpath = ["../../.."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
