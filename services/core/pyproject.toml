[project]
name = "aloai-core"
version = "0.1.0"
requires-python = ">=3.11"
description = "Alo.ai Core service (Grader and Reading Coach: W3)"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "httpx2>=2.14,<3", "ruff>=0.6"]

[tool.pytest.ini_options]
# Run from the repo root with: pytest -c services/core/pyproject.toml services/core
pythonpath = ["../..", "../../libs/aloai"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
