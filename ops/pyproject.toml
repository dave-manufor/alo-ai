[project]
name = "aloai-ops"
version = "0.1.0"
requires-python = ">=3.11"
description = "Alo.ai operations scripts (W1)"

[tool.pytest.ini_options]
# Run from the repo root with: pytest -c ops/pyproject.toml ops
pythonpath = ["..", "../libs/aloai"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
