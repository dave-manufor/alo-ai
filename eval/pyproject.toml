[project]
name = "aloai-eval"
version = "0.1.0"
requires-python = ">=3.11"
description = "Alo.ai agent evaluation sets (W3): Reading Coach, red-team, grading, golden recordings"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6"]

[tool.pytest.ini_options]
# Run from the repo root with: pytest -c eval/pyproject.toml eval
pythonpath = ["..", "../libs/aloai"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
